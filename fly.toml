# Fly.io 배포 설정 — 취업규칙 검토 AI 백엔드
#
# 도쿄(nrt) 리전: 한국에서 가장 가까운 Fly 리전 (ping ~30ms).
# auto_stop = false + min_machines_running = 1 → 콜드 스타트 없음 (항상 가동).
#
# 최초 배포:
#   fly launch --no-deploy      # 앱 생성 (이 toml 사용)
#   fly secrets set OPENAI_API_KEY=sk-... API_KEY=... ADMIN_API_KEY=...
#   fly deploy
#
# 이후 배포: fly deploy

app = "cgr-backend"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  OPENAI_MODEL = "gpt-4o-mini"

[http_service]
  internal_port = 8080
  force_https = true
  # 항상 1대 유지 — 콜드 스타트 제거 (영세사업장 사용자 응답성 우선)
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

# 헬스체크 — /api/v1/warmup (인증 불필요, 즉시 200)
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/v1/warmup"

[[vm]]
  # 분석 LLM 대기 중 메모리 여유 — 1GB. 부족하면 2048 로 상향.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
