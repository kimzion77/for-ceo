version: v0
doc: wage_statement
description: |
  임금명세서 슬롯 카탈로그 (v0).
  근거: 근로기준법 제48조 제2항 + 동법 시행령 제27조의2.
  2021-11-19 이후 모든 사용자(상시 1인 이상)는 임금 지급 시 임금명세서를 서면(전자문서 포함) 교부 의무.

  검토 AI 파이프라인:
    [추출(LLM)] 임금명세서 텍스트 → 항목별 기재 여부 + 금액·계산기초
    → [정합성 판정(코드)] 필수 기재 7대 카테고리 미기재 검사
    → [위험도 산출] HIGH(임금총액·구성항목) / MEDIUM(공제·계산기초) / LOW(형식)

schema:
  slot_id: 고유 ID (SLOT_WS_<index>_<field>)
  doc: wage_statement
  applicability: 적용 조건 — 모든 사업장 적용 (5인미만 포함)
  field: 필수 기재 항목명
  required_content: 기재되어야 할 내용
  purpose: 기재 필요 이유
  topic_meta: 연관 주제 (노무사회 02_주제_노하우 코퍼스 참조)
  laws: 관련 법령
  comparator: presence (기재 여부) — 일부는 numeric_consistency 추후 도입 예정
  missing_severity: 미기재 시 위험도
  violation_severity: 내용 부적절 시 위험도
  fix_example: 시정 예시

risk_levels:
  HIGH: 임금 총액·구성항목 미기재 — 임금체불 분쟁 핵심 증거 누락
  MEDIUM: 공제 내역·계산기초 미기재 — 투명성 결여
  LOW: 형식·표현 권고

verdict_buckets:
  부적절: "필수 기재 누락 또는 명백한 법령 위반 (예: 공제 항목 총액만 표시)"
  보완필요: "기재는 있으나 항목별 분리·계산기초 미흡"
  적절: "법정 기준 충족 + 항목별 명확 기재"

slots:
- slot_id: SLOT_WS_01_근로자_성명
  doc: wage_statement
  applicability:
    business_size: any
    worker_types: any
  field: 성명
  required_content: 근로자 성명 (한글 또는 영문 풀네임)
  purpose: 근로자 특정 — 동일 사업장 동명이인 식별
  topic_meta:
  - 임금 1.1
  laws:
  - 근로기준법 시행령 제27조의2 제1호
  comparator: presence
  missing_severity: HIGH
  violation_severity: MEDIUM
  fix_example: "성명: 홍길동"

- slot_id: SLOT_WS_02_근로자_특정정보
  doc: wage_statement
  applicability:
    business_size: any
    worker_types: any
  field: 생년월일·사원번호 등
  required_content: 생년월일 또는 사원번호 등 근로자를 특정할 수 있는 정보
  purpose: 동명이인 식별·인사관리 연계
  topic_meta:
  - 임금 1.1
  laws:
  - 근로기준법 시행령 제27조의2 제1호
  comparator: presence
  missing_severity: MEDIUM
  violation_severity: LOW
  fix_example: "사원번호: 2024-001 (또는 생년월일 1990-01-01)"

- slot_id: SLOT_WS_03_임금지급일
  doc: wage_statement
  applicability:
    business_size: any
    worker_types: any
  field: 임금 지급일
  required_content: 임금 지급일 (YYYY-MM-DD)
  purpose: 정기지급의무·체불 여부 판단 기준일
  topic_meta:
  - 임금 2.1
  - 임금체불 1.1
  laws:
  - 근로기준법 제43조 제2항
  - 근로기준법 시행령 제27조의2 제2호
  comparator: presence
  missing_severity: HIGH
  violation_severity: HIGH
  fix_example: "지급일: 2024-05-25"

- slot_id: SLOT_WS_04_임금총액
  doc: wage_statement
  applicability:
    business_size: any
    worker_types: any
  field: 임금 총액
  required_content: 공제 전 임금 총액 (= 임금 구성항목 합계)
  purpose: 근로 대가의 전체 규모 확인 — 체불·최저임금 판단 기준
  topic_meta:
  - 임금 3.1
  - 최저임금 1.1
  laws:
  - 근로기준법 시행령 제27조의2 제3호
  comparator: presence
  missing_severity: HIGH
  violation_severity: HIGH
  fix_example: "임금 총액(세전): 2,500,000원"

- slot_id: SLOT_WS_05_구성항목별_금액
  doc: wage_statement
  applicability:
    business_size: any
    worker_types: any
  field: 임금의 구성항목별 금액
  required_content: 기본급, 각종 수당(연장·야간·휴일근로 가산수당 포함), 상여금, 성과금, 그 밖의 임금을 항목별로 분리 기재
  purpose: 통상임금·평균임금 산정의 근거 — 항목별 분리 없이는 분쟁 발생
  topic_meta:
  - 임금 3.2
  - 통상임금 1.1
  - 가산수당 1.1
  laws:
  - 근로기준법 시행령 제27조의2 제3호
  - 근로기준법 제56조
  comparator: presence
  missing_severity: HIGH
  violation_severity: HIGH
  fix_example: "기본급 2,000,000원 / 연장근로수당 300,000원 / 식대 100,000원 / 상여금 100,000원"

- slot_id: SLOT_WS_06_계산기초
  doc: wage_statement
  applicability:
    business_size: any
    worker_types: any
  field: 출근일수·근로시간 등 계산기초
  required_content: 출근일수, 근로시간 수, 연장·야간·휴일근로 시간 등 그 항목의 계산기초가 되는 사항 (출근일·시간에 따라 금액이 정해지는 항목에 한정)
  purpose: 가산수당·일급제 등의 산정 근거 — 누락 시 임금체불 입증 곤란
  topic_meta:
  - 임금 3.3
  - 근로시간 2.1
  - 가산수당 2.1
  laws:
  - 근로기준법 시행령 제27조의2 제4호
  - 근로기준법 제56조
  comparator: presence
  missing_severity: MEDIUM
  violation_severity: HIGH
  fix_example: "근로시간 209h / 연장근로 10h / 야간근로 0h / 휴일근로 8h"

- slot_id: SLOT_WS_07_공제내역
  doc: wage_statement
  applicability:
    business_size: any
    worker_types: any
  field: 공제 항목별 금액과 총액
  required_content: 근로소득세, 4대보험료(국민연금·건강보험·장기요양·고용보험), 기타 공제(노조비·가불금 등)를 항목별로 분리 + 공제 총액
  purpose: 공제의 적법성·금액 적정성 확인 — 합법적 공제 사유만 허용 (근로기준법 제43조)
  topic_meta:
  - 임금 3.4
  - 임금체불 2.1
  laws:
  - 근로기준법 시행령 제27조의2 제5호
  - 근로기준법 제43조 제1항
  comparator: presence
  missing_severity: HIGH
  violation_severity: HIGH
  fix_example: "근로소득세 50,000원 / 국민연금 112,500원 / 건강보험 88,000원 / 장기요양 11,300원 / 고용보험 22,500원 / 공제 총액 284,300원"

- slot_id: SLOT_WS_08_실지급액
  doc: wage_statement
  applicability:
    business_size: any
    worker_types: any
  field: 실지급액
  required_content: 임금 총액에서 공제 총액을 뺀 실수령 금액
  purpose: 근로자가 실제로 수령한 금액 명시 — 은행 입금 내역과 대조 가능
  topic_meta:
  - 임금 3.5
  laws:
  - 근로기준법 시행령 제27조의2 제3호
  comparator: presence
  missing_severity: HIGH
  violation_severity: HIGH
  fix_example: "실지급액: 2,215,700원"

- slot_id: SLOT_WS_09_교부방법
  doc: wage_statement
  applicability:
    business_size: any
    worker_types: any
  field: 교부 방법
  required_content: 서면(종이) 또는 전자문서(이메일·앱·문자 등) 형태로 교부. 교부 사실을 입증할 수 있어야 함.
  purpose: 교부 의무 이행 입증 — 미교부 시 500만원 이하 과태료
  topic_meta:
  - 임금 4.1
  laws:
  - 근로기준법 제48조 제2항
  comparator: presence
  missing_severity: HIGH
  violation_severity: MEDIUM
  fix_example: "교부 방식: 사내 그룹웨어 PDF 배포 (이메일 전송 내역 보관)"

- slot_id: SLOT_WS_10_기간제_단시간_근로시간
  doc: wage_statement
  applicability:
    business_size: any
    worker_types:
    - 기간제
    - 단시간
  field: 단시간·기간제 근로일·근로시간
  required_content: 단시간·기간제 근로자의 경우 근로일별 근로시간 명시 (월급제도 일별 계산기초 필요)
  purpose: 단시간근로자 보호법상 비례원칙 적용 — 통상근로자 대비 임금 비율 검증
  topic_meta:
  - 임금 3.3
  - 근로시간 3.1
  laws:
  - 기간제 및 단시간근로자 보호 등에 관한 법률 제17조
  - 근로기준법 시행령 제27조의2 제4호
  comparator: presence
  missing_severity: MEDIUM
  violation_severity: HIGH
  fix_example: "주 4일 × 1일 6시간 = 주 24시간 / 월 104시간"

- slot_id: SLOT_WS_11_사용자_정보
  doc: wage_statement
  applicability:
    business_size: any
    worker_types: any
  field: 사용자 정보
  required_content: 상호, 대표자, 사업자등록번호 (임금대장과의 연계 확인용 — 권장)
  purpose: 발급 주체 특정 — 분쟁 시 사용자 식별 (법정 필수기재 사항은 아니나 실무 권장)
  topic_meta:
  - 임금 1.2
  laws:
  - 근로기준법 제48조
  comparator: presence
  missing_severity: LOW
  violation_severity: LOW
  fix_example: "(주)○○상사 / 대표 김○○ / 사업자등록번호 123-45-67890"
