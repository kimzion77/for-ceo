version: v0
doc: service_provider_contract
description: |
  노무제공자 계약서 (특수형태근로종사자 / 플랫폼 종사자) 슬롯 카탈로그 v0.

  대상: 산재보험법 제125조·고용보험법 제77조의2 적용 노무제공자
    — 학습지 교사, 보험설계사, 골프장 캐디, 택배기사, 화물차주, 가전 설치/배송 기사,
      대리운전기사, 방문판매원, 신용카드 모집인, 학원강사(일부), 대여제품 점검원 등.

  근로기준법 적용 X (도급·위임 성격) → 단, 고용노동부 권고 표준 노무제공계약서 양식이 있으며
  사회보험(산재·고용)은 일부 적용. "근로자성 위장" (사실상 종속관계인데 도급으로 위장) 방지가 핵심.

  검토 파이프라인:
    [추출(LLM)] 노무제공계약서 텍스트 → 슬롯별 기재 여부·내용
      → [정합성 판정(코드+LLM)] required_content 비교 + 종속성 표현 검출
      → [위험도 산출] severity 부여 → 적절/보완필요/부적절 라벨링

schema:
  slot_id: 고유 ID (SLOT_SC_<index>_<field>)
  doc: 문서 종류 — service_provider_contract
  applicability: 적용 조건 — worker_subtype (산재 적용 / 고용보험 적용 / 둘 다)
  field: 필수 기재 항목명
  required_content: 기재되어야 할 내용
  purpose: 기재 필요 이유
  topic_meta: 연관 주제
  laws: 관련 법령
  comparator: 비교 연산자 — 모두 presence + 일부 슬롯은 prohibited_pattern
  missing_severity: 미기재 시 위험도
  violation_severity: 내용 부적절 시 위험도
  fix_example: 시정 예시
  prohibited_patterns: (선택) 검출되면 부적절 처리할 표현 — 종속성 강화·일방적 권리 등

risk_levels:
  HIGH: 사회보험 누락 / 근로자성 위장 표현 / 일방적 해지권 등 분쟁 소지 매우 큼
  MEDIUM: 필수 기재 누락 (보수·기간·업무 등)
  LOW: 형식·표현 다듬기

verdict_buckets:
  부적절: 사회보험 미가입 / 근로자성 위장 / 법령 명백 위반
  보완필요: 기재는 있으나 모호하거나 보호 수준 부족
  적절: 표준 양식 수준의 보호 + 사회보험 가입 명시

worker_subtypes:
  - 산재적용_특고16  # 산업재해보상보험법 시행령 별표 6-3 적용 16개 직종
  - 고용보험_노무제공자19  # 고용보험법 시행령 제104조의5 적용 19개 직종
  - 플랫폼종사자  # 배달·운송·가사·돌봄 등 플랫폼 매개
  - 기타_도급

slots:

- slot_id: SLOT_SC_01_사업주_정보
  doc: service_provider_contract
  applicability:
    worker_subtype: any
  field: 사업주 정보
  required_content: 상호, 사업자등록번호, 대표자, 사업장 소재지, 연락처
  purpose: 노무 수령 주체 특정 — 사회보험 가입 의무자·산재 신고 의무자 확정
  topic_meta:
  - 노무제공계약 1.1
  laws:
  - 산업재해보상보험법 제125조
  comparator: presence
  missing_severity: MEDIUM
  violation_severity: MEDIUM
  fix_example: 상호, 사업자등록번호, 대표자, 사업장 소재지, 전화번호

- slot_id: SLOT_SC_02_노무제공자_정보
  doc: service_provider_contract
  applicability:
    worker_subtype: any
  field: 노무제공자 정보
  required_content: 성명, 생년월일, 주소, 연락처, 직종(업무 분류)
  purpose: 노무제공자 특정 + 사회보험 적용 직종 확인
  topic_meta:
  - 노무제공계약 1.1
  laws:
  - 고용보험법 시행령 제104조의5
  comparator: presence
  missing_severity: MEDIUM
  violation_severity: MEDIUM
  fix_example: 성명, 생년월일, 주소, 연락처, 직종(택배기사 등)

- slot_id: SLOT_SC_03_적용_직종_분류
  doc: service_provider_contract
  applicability:
    worker_subtype: any
  field: 적용 직종 (사회보험 분류)
  required_content: 산재보험법 적용 16개 직종 / 고용보험 적용 19개 직종 중 어디에 해당하는지 명시
  purpose: 사회보험 가입 의무 자동 판정 — 미명시면 보험 가입 누락 가능
  topic_meta:
  - 사회보험 4.1
  laws:
  - 산업재해보상보험법 시행령 별표 6-3
  - 고용보험법 시행령 제104조의5
  comparator: presence
  missing_severity: HIGH
  violation_severity: HIGH
  fix_example: 산업재해보상보험법 적용 직종 — 화물차주 (직종번호 13)

- slot_id: SLOT_SC_04_계약기간
  doc: service_provider_contract
  applicability:
    worker_subtype: any
  field: 계약 기간
  required_content: 시작일, 종료일, 자동갱신 조건(있을 경우)
  purpose: 계약 존속기간 명확화 — 갱신 거절 시 분쟁 예방
  topic_meta:
  - 노무제공계약 2.1
  laws:
  - 민법 제660조 (위임 해지)
  comparator: presence
  missing_severity: MEDIUM
  violation_severity: MEDIUM
  fix_example: 2026-01-01 ~ 2026-12-31 (양 당사자 합의 시 갱신 가능)

- slot_id: SLOT_SC_05_노무제공_장소
  doc: service_provider_contract
  applicability:
    worker_subtype: any
  field: 노무제공 장소
  required_content: 주된 제공 장소 (출장·배송·플랫폼 매개의 경우 그 형태 표시)
  purpose: 산재 발생 시 업무 관련성 판단 근거
  topic_meta:
  - 안전보건 5.1
  laws:
  - 산업재해보상보험법 제5조
  comparator: presence
  missing_severity: LOW
  violation_severity: LOW
  fix_example: 사업장 내 / 또는 플랫폼이 지정하는 배송지 (서울·경기 지역)

- slot_id: SLOT_SC_06_업무_내용
  doc: service_provider_contract
  applicability:
    worker_subtype: any
  field: 업무 내용
  required_content: 구체적 업무 범위 — 추상적 표현 금지, 결과물·서비스 단위로 명시
  purpose: 업무 범위 외 지시 거부권 보호 + 근로자성 분쟁 시 입증 근거
  topic_meta:
  - 노무제공계약 2.2
  laws:
  - 민법 제655조 이하
  comparator: presence
  missing_severity: MEDIUM
  violation_severity: MEDIUM
  fix_example: |
    가전제품 설치 — 사업주가 지정한 배송지에서 ① 제품 개봉·설치, ② 작동 확인,
    ③ 사용 안내. 1건당 수당 지급.
  prohibited_patterns:
  - "사업주가 지시하는 일체의 업무"
  - "기타 회사가 부여하는 업무"

- slot_id: SLOT_SC_07_노무제공_방식
  doc: service_provider_contract
  applicability:
    worker_subtype: any
  field: 노무제공 방식 (자율성 보장)
  required_content: 노무제공자가 시간·장소·방법을 자율적으로 결정한다는 취지 명시
  purpose: 근로자성 위장 방지 — 종속성 표현 검출
  topic_meta:
  - 근로자성_판단 3.1
  laws:
  - 대법원 2006다17287 (근로자성 판단 기준)
  comparator: presence
  missing_severity: HIGH
  violation_severity: HIGH
  fix_example: |
    노무제공자는 계약의 본질을 해치지 않는 범위에서 노무 제공 시간·방법·순서를
    자율적으로 결정한다.
  prohibited_patterns:
  - "출근 시간을 준수"
  - "근무시간 09:00~18:00"  # 도급에 출퇴근 시간 명시 → 근로자성 강화
  - "지각·결근 시 징계"
  - "취업규칙을 준수"

- slot_id: SLOT_SC_08_보수
  doc: service_provider_contract
  applicability:
    worker_subtype: any
  field: 보수 (수수료·수당)
  required_content: 보수 구성(기본·성과·수수료율), 계산 방식, 단가 또는 산정식
  purpose: 보수 산정 분쟁 예방 + 최저 보수 보장 검증 가능
  topic_meta:
  - 보수 4.2
  laws:
  - 산업재해보상보험법 제125조 제8항 (보수 기준)
  comparator: presence
  missing_severity: HIGH
  violation_severity: HIGH
  fix_example: |
    건당 수수료 — 일반배송 3,500원 / 특수배송 5,000원
    월 최소 보장액: 없음 / 또는 (실 운임의 X%)

- slot_id: SLOT_SC_09_보수_지급일
  doc: service_provider_contract
  applicability:
    worker_subtype: any
  field: 보수 지급일·방법
  required_content: 지급일(매월/매주), 지급방법(계좌이체), 정산주기, 공제 항목
  purpose: 임금체불 분쟁 예방 — 노무제공자도 보수 미지급은 민사상 채권
  topic_meta:
  - 보수 4.2
  laws:
  - 민법 제665조
  comparator: presence
  missing_severity: MEDIUM
  violation_severity: MEDIUM
  fix_example: 매월 말일 마감, 익월 10일 계좌이체 (수수료에서 산재보험료 사업주 부담분 외 공제 없음)

- slot_id: SLOT_SC_10_산재보험
  doc: service_provider_contract
  applicability:
    worker_subtype: 산재적용_특고16
  field: 산재보험 가입·보험료 부담
  required_content: 산재보험 가입 의무, 보험료 부담 비율(사업주 100%), 가입 거부권 (2023년 폐지) 명시
  purpose: 산재보험법 제125조에 따른 의무 가입 — 사업주가 100% 부담
  topic_meta:
  - 사회보험 4.1
  laws:
  - 산업재해보상보험법 제125조
  - 산업재해보상보험법 시행령 제125조
  comparator: presence
  missing_severity: HIGH
  violation_severity: HIGH
  fix_example: |
    사업주는 산업재해보상보험법 제125조에 따라 노무제공자를 산재보험에 가입시키며,
    보험료는 사업주가 전액 부담한다.

- slot_id: SLOT_SC_11_고용보험
  doc: service_provider_contract
  applicability:
    worker_subtype: 고용보험_노무제공자19
  field: 고용보험 가입·보험료 부담
  required_content: 고용보험 가입 의무, 보험료 분담 비율(사업주·노무제공자 각 50%)
  purpose: 고용보험법 제77조의2 의무 가입 — 실업급여·출산전후급여 지급 대상
  topic_meta:
  - 사회보험 4.1
  laws:
  - 고용보험법 제77조의2
  - 고용보험법 시행령 제104조의5
  comparator: presence
  missing_severity: HIGH
  violation_severity: HIGH
  fix_example: |
    사업주와 노무제공자는 고용보험법 제77조의2에 따라 고용보험에 가입하며,
    보험료는 보수의 0.9%로 각 50%씩 부담한다.

- slot_id: SLOT_SC_12_안전보건_의무
  doc: service_provider_contract
  applicability:
    worker_subtype: any
  field: 안전·보건 의무
  required_content: 사업주의 안전보건 조치 의무(보호구·교육), 노무제공자의 안전수칙 준수
  purpose: 산업안전보건법 제77조 (특고 안전보건 조치) 의무
  topic_meta:
  - 안전보건 5.1
  laws:
  - 산업안전보건법 제77조
  - 산업안전보건법 시행규칙 제95조
  comparator: presence
  missing_severity: MEDIUM
  violation_severity: HIGH
  fix_example: |
    사업주는 산업안전보건법 제77조에 따라 안전 교육·보호구를 제공한다.
    노무제공자는 안전수칙을 준수하며 위험 인지 시 즉시 작업 중지 및 통지한다.

- slot_id: SLOT_SC_13_계약해지
  doc: service_provider_contract
  applicability:
    worker_subtype: any
  field: 계약 해지 사유·절차
  required_content: 해지 사유, 사전 통지 기한(최소 30일 권장), 양 당사자 동등한 해지권
  purpose: 사업주 일방적 해지권 남용 방지 — "갑질" 분쟁의 핵심
  topic_meta:
  - 노무제공계약 2.3
  laws:
  - 민법 제660조 (위임 해지)
  comparator: presence
  missing_severity: HIGH
  violation_severity: HIGH
  fix_example: |
    양 당사자는 30일 전 서면 통지로 계약을 해지할 수 있다.
    사업주는 노무제공자의 귀책 없는 사유로 일방 해지할 수 없다.
  prohibited_patterns:
  - "회사는 언제든지 계약을 해지할 수 있다"
  - "사업주의 판단에 따라 즉시 해지"
  - "노무제공자는 30일 전 통지" # 한쪽만 통지 의무

- slot_id: SLOT_SC_14_손해배상_책임
  doc: service_provider_contract
  applicability:
    worker_subtype: any
  field: 손해배상·책임 한계
  required_content: 손해 발생 시 책임 범위, 고의·중과실 한정, 무한 책임 금지
  purpose: 일방적·무한 손해배상 조항으로 인한 노무제공자 피해 방지
  topic_meta:
  - 노무제공계약 2.4
  laws:
  - 민법 제390조, 제393조
  comparator: presence
  missing_severity: MEDIUM
  violation_severity: HIGH
  fix_example: |
    노무제공자의 고의·중과실로 발생한 손해에 한하여 책임을 진다.
    그 범위는 실손해 + 합리적 부대비용으로 한다.
  prohibited_patterns:
  - "일체의 손해를 배상"
  - "결과적 손해를 포함한 모든 손해"
  - "노무제공자가 무한 책임을 진다"

- slot_id: SLOT_SC_15_분쟁해결
  doc: service_provider_contract
  applicability:
    worker_subtype: any
  field: 분쟁 해결 방법
  required_content: 협의·조정 우선, 관할 법원, 노무제공자 보호 분쟁조정위원회 활용 안내
  purpose: 분쟁 시 합리적 해결 경로 — 강제 중재 조항 회피
  topic_meta:
  - 노무제공계약 2.5
  laws:
  - 민사소송법 제2조
  comparator: presence
  missing_severity: LOW
  violation_severity: MEDIUM
  fix_example: |
    분쟁은 우선 협의로 해결하며, 협의 불성립 시 관할 법원(노무제공자 주소지 법원)에
    제기할 수 있다.
  prohibited_patterns:
  - "사업주 소재지 법원의 전속 관할"
  - "강제 중재"

- slot_id: SLOT_SC_16_근로자성_위장_방지
  doc: service_provider_contract
  applicability:
    worker_subtype: any
