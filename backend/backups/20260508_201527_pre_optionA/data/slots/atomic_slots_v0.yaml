version: v0
description: |
  표준취업규칙(2025년) 원자 슬롯 카탈로그.
  마스터 DB: E:/취업규칙 마스터 db.xlsx 의 각 조를 LLM 추출 단위인 원자 슬롯으로 분해.
  검토 AI 파이프라인:
    [추출(LLM)] 사업장 취업규칙 → 슬롯별 추출값
      → [정합성 판정(코드)] master_value 와 비교
      → [위험도 산출] severity 부여 → 부적정 라벨링
schema:
  slot_id:           고유 ID (SLOT_<주제>_<세부>)
  article:           마스터 DB 조 번호 (1~98)
  parent_clause:     본문 항 번호 (참고용)
  required:          필수기재 여부 (true=미기재 시 과태료)
  topic_meta:        마스터 DB H열 메타토픽 (배열)
  extract_target:    LLM 추출 지시문 (system prompt 단편)
  extract_schema:    추출 결과 JSON 스키마
  master_value:      마스터 DB의 기준값
  comparator:        비교 연산자 (==, >=, <=, contains, not_contains, presence)
  violation_severity: 비교 위반 시 위험도 (CRITICAL/HIGH/MEDIUM/LOW)
  missing_severity:  미기재 시 위험도
  penalty:           위반/미기재 시 적용 벌칙 (마스터 DB I열 인용)
  master_db_ref:     원본 추적 (D=본문, F=참고, K=신법, L=구법, freq_issue=N열 #)
  example_compliant: 적정 표현 예시
  example_violation: 부적정 표현 + 사유 + 위험도
risk_levels:
  CRITICAL: 형사처벌(징역) 또는 즉시 위법. 임금체불·연차 미부여·해고제한 위반 등.
  HIGH:    과태료 + 근로자 직접 피해. 임금명세서·괴롭힘 조치 미이행 등.
  MEDIUM:  표현 불명확·구법 잔존·수치 표기오류.
  LOW:     형식·권고. 사명 표기·임의 규정 누락 등.

# ============================================================
# 제33조 (연차유급휴가) — 11개 슬롯
# 마스터 DB: A34~N34
# 필수/선택: 필수
# 핵심 빈출지적: #7 — 1년 미만자 연차의 15일 공제 조항(개정으로 삭제됨)
# 25년 개정: 육아휴직(2024.1.1)·육아기/임신기 단축(2024.10.22) 출근 간주 신설
# ============================================================

slots:

  - slot_id: SLOT_연차_1년이상_80%_15일
    article: 33
    parent_clause: "①"
    required: true
    topic_meta: [연차유급휴가 2.1.2]
    extract_target: |
      사업장 취업규칙에서 "1년간 80% 이상 출근한 근로자에게 부여되는 연차유급휴가 일수"를 찾아 정수(일)로 추출.
      관련 키워드: "1년", "80%", "80퍼센트", "출근", "연차", "유급휴가", "15일".
      명시 없으면 null.
    extract_schema:
      type: integer
      unit: 일
      nullable: true
    master_value:
      value: 15
      unit: 일
    comparator: ">="
    violation_severity: CRITICAL
    missing_severity: CRITICAL
    penalty:
      - 근로기준법 제116조 제2항 제2호 — 500만원 이하 과태료 (미기재)
      - 근로기준법 제110조 제1호 — 2년 이하 징역 또는 2천만원 이하 벌금 (제60조 위반)
    master_db_ref:
      D: "① 1년간 80퍼센트 이상 출근한 사원에게는 15일의 유급휴가를 준다."
