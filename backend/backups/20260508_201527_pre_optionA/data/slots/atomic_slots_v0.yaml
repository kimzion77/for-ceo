    fix_example: "1년간 80% 이상 출근한 사원에게는 15일의 연차유급휴가를 부여한다."
    example_violation:
      - text: "1년간 80% 이상 출근한 사원에게 10일의 유급휴가를 부여한다."
        reason: 법정 15일 미달
